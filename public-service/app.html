<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拍摄排单 · 公共服务</title><style>
*{box-sizing:border-box}body{margin:0;background:#efecf3;color:#292630;font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}main{max-width:1080px;margin:30px auto;padding:0 22px}.brand{display:flex;align-items:center;gap:13px;font-size:24px;font-weight:750}.brand svg{width:38px;height:42px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.muted{color:#90859b;font-size:14px}.hero h1{font-size:36px;letter-spacing:-1px;margin:0 0 8px}.hero p{max-width:760px;margin:0 0 26px;color:#8e8199}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e8e2ef;border-radius:25px;padding:28px;margin-bottom:18px}.purple{background:#e8e1f3}.yellow{background:#fff2cb}h2{font-size:22px;margin:0 0 18px}h3{margin:0 0 10px;font-size:17px}label{display:block;color:#85758f;font-size:13px;margin:14px 0 7px}input,textarea,select{width:100%;min-width:0;border:1px solid #e4ddec;background:#fdfcff;border-radius:13px;padding:13px;color:#433c4d}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #a293b4;outline-offset:2px}.btn{display:inline-block;border:1px solid #ded7e9;border-radius:13px;background:white;padding:12px 18px;text-decoration:none;color:#65556f;text-align:center}.primary{background:#29252f;border-color:#29252f;color:white}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions>*{flex:1}.pill{display:inline-block;border-radius:20px;padding:5px 12px;background:#e9e3f0;font-size:13px;color:#82738f}.pill.active{background:#d9eee3;color:#427b66}.pill.pending{background:#fff0c6;color:#a18136}.pill.rejected,.pill.suspended{background:#f8d8d8;color:#a36262}.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{background:#f8f5fb;border-radius:17px;padding:16px}.metric strong{display:block;font-size:23px}.metric small{color:#908099}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.notice{padding:15px 18px;border-radius:16px;background:#fff5d9;color:#8b754b;font-size:14px}.error{color:#b4675a;white-space:pre-line;margin:12px 0}.review{border-top:1px solid #e8e2ef;margin-top:20px;padding-top:20px}.details{white-space:pre-wrap;word-break:break-word;background:#f9f6fc;padding:16px;border-radius:14px}dialog{width:min(580px,calc(100vw - 28px));max-height:calc(100dvh - 40px);overflow:auto;border:1px solid #e4dcec;border-radius:24px;background:#f7f4fb;padding:26px;color:#3c3346}dialog::backdrop{background:#2b243966;backdrop-filter:blur(4px)}#confirmation{white-space:pre-wrap;line-height:1.9}.check{display:flex;align-items:center;gap:10px}.check input{width:20px;height:20px}.hidden{display:none}button:disabled{opacity:.5;cursor:default}footer{font-size:12px;color:#9a8ca5;text-align:center;padding:15px 0 30px}a{color:#766184}.quota-hint{font-size:12px;color:#9a8a9e}.inline{display:flex;gap:8px;align-items:center}.inline>*{flex:1}@media(max-width:650px){main{margin:18px auto;padding:0 14px}.brand{font-size:21px}.hero h1{font-size:29px}.grid{grid-template-columns:1fr}.card{padding:22px;border-radius:21px}.rows{grid-template-columns:1fr 1fr}.form-grid{gap:0 10px}.top{align-items:flex-start}.top .btn{font-size:12px;padding:9px}.metric strong{font-size:21px}}
</style></head><body><main><header class="top"><div class="brand"><svg viewBox="0 0 24 26" aria-hidden="true"><path d="M4 10 3 2l7 4a13 13 0 0 1 4 0l7-4-1 8c2 2 3 5 2 8-1 4-5 6-10 6S3 22 2 18c-1-3 0-6 2-8Z" fill="currentColor"/><path d="M7 13h2m6 0h2" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>拍摄排单</div><button class="btn hidden" id="logout">退出登录</button></header><section class="hero"><h1 id="heading">自助预约，拍摄有序</h1><p id="subtitle">下载安装或打开网页，申请自己的摄影师账号。审核通过并获得额度后，创建场次、分享预约链接，客人填表后自动排单。</p></section><p class="error" id="error" role="status"></p><div id="view"></div><footer>公共版采用申请注册制，所有使用额度由运营者审核分配。<br>自行部署可使用自己的资源。<a href="https://github.com/birdisleeee/photo-tools" target="_blank" rel="noopener">开源项目与安装说明</a></footer></main><dialog id="confirmDialog"><h2>请再次确认</h2><p id="confirmation"></p><p class="error" id="confirmError"></p><div class="actions"><button class="btn" id="cancelConfirm">返回修改</button><button class="btn primary" id="acceptConfirm">确认提交</button></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={pending:'待审核',active:'已批准',rejected:'申请未通过',suspended:'已停用'},quotaNames={events:'场次总数',orders:'预约记录总数',bytes:'图片与记录存储（MB）',notifications:'通知发送总次数',requestsPerDay:'每天接口请求上限'};
let current=null;
async function api(path,data){const r=await fetch('/service/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});let j;try{j=await r.json()}catch{throw Error('服务暂时无法连接，请稍后重试')}if(!r.ok||!j.ok)throw Error(j.error||'操作未完成');return j}
function error(e){$('error').textContent=e.message||String(e)}
function quotaForm(q={},prefix='q'){return '<div class="form-grid">'+Object.entries(quotaNames).map(([k,l])=>'<div><label for="'+prefix+k+'">'+l+'</label><input id="'+prefix+k+'" name="'+k+'" type="number" min="0" step="1" required value="'+esc(k==='bytes'?Math.floor((q[k]||0)/1048576):(q[k]||0))+'"></div>').join('')+'</div>'}
function getQuota(form){return Object.fromEntries(Object.keys(quotaNames).map(k=>[k,Number(form.elements[k].value)*(k==='bytes'?1048576:1)]))}
function quotaText(q){return Object.entries(quotaNames).map(([k,l])=>l+'：'+(k==='bytes'?q[k]/1048576:q[k])).join('\n')}
async function confirmAction(text,action){$('confirmation').textContent=text;$('confirmError').textContent='';$('confirmDialog').showModal();$('cancelConfirm').onclick=()=>$('confirmDialog').close();$('acceptConfirm').onclick=async()=>{const b=$('acceptConfirm');b.disabled=true;try{await action();$('confirmDialog').close();await load()}catch(e){$('confirmError').textContent=e.message}finally{b.disabled=false}}}
function wireForm(id,path){$(id).onsubmit=async e=>{e.preventDefault();$('error').textContent='';const b=e.target.querySelector('[type=submit]');b.disabled=true;try{await api(path,Object.fromEntries(new FormData(e.target)));await load()}catch(e){error(e)}finally{b.disabled=false}}}
function renderAuth(){
 const owner=location.pathname==='/owner';$('logout').classList.add('hidden');
 if(owner){$('heading').textContent='运营管理';$('subtitle').textContent='审核注册申请，手动分配和调整额度。此入口仅供服务运营者使用。';$('view').innerHTML='<section class="card"><h2>运营者登录</h2><form id="ownerLogin"><label for="ownerKey">运营密钥</label><input id="ownerKey" name="key" type="password" autocomplete="current-password" required><div class="actions"><button class="btn primary" type="submit">进入运营后台</button><a class="btn" href="/app">返回账号入口</a></div></form></section>';wireForm('ownerLogin','owner-login');return}
 $('view').innerHTML='<div class="grid"><section class="card"><h2>登录自己的账号</h2><form id="loginForm"><label for="loginUsername">账号名</label><input id="loginUsername" name="username" autocomplete="username" required><label for="loginPassword">密码</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><div class="actions"><button class="btn primary" type="submit">登录</button></div></form><div class="notice" style="margin-top:20px">已有独立网页部署的用户继续使用自己的站点；公共账号与自用排单数据互不相通。</div></section><section class="card purple"><h2>申请摄影师账号</h2><p class="muted">提交后等待审核，所有额度初始为 0。获准使用后会获得独立预约链接。</p><form id="registerForm"><label for="regUsername">账号名（小写英文开头，4–24 位）</label><input id="regUsername" name="username" pattern="[a-z][a-z0-9_-]{3,23}" autocomplete="username" required><label for="regPassword">密码（至少 12 位）</label><input id="regPassword" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="regName">你的称呼</label><input id="regName" name="name" maxlength="40" required><label for="regContact">审核联系方式（微信、QQ 或邮箱）</label><input id="regContact" name="contact" maxlength="120" required><label for="regReason">拍摄用途与申请原因</label><textarea id="regReason" name="reason" maxlength="500" required></textarea><div class="actions"><button class="btn primary" type="submit">提交注册申请</button></div></form></section></div><section class="card"><h2>手机上使用</h2><p class="muted">安卓安装后使用同一账号登录；客人通过预约链接填写，不需要安装 APK。公共版需要联网。</p><a class="btn" href="/download/app.apk">下载安卓 APK</a></section>';wireForm('loginForm','login');
 $('registerForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));confirmAction('申请账号：'+data.username+'\n审核联系：'+data.contact+'\n申请将进入待审核状态，不会自动获得额度。',()=>api('register',data))};
}
function renderAccount(j){
 current=j.user;const u=j.user,q=u.quota,usage=j.accountUsage?.usage||{},daily=j.accountUsage?.daily||{};$('heading').textContent='你好，'+u.name;$('subtitle').textContent='管理你的账号、预约链接和使用额度。';$('logout').classList.remove('hidden');
 const cells=Object.entries(quotaNames).map(([k,l])=>'<div class="metric"><small>'+l+'</small><strong>'+(k==='bytes'?(Math.ceil((usage.bytes||0)/1048576)+' / '+q.bytes/1048576):((k==='requestsPerDay'?daily.count:usage[k])||0)+' / '+q[k])+'</strong></div>').join('');
 $('view').innerHTML='<section class="card"><div class="inline"><h2>'+esc(u.name)+'</h2><span class="pill '+u.status+'">'+labels[u.status]+'</span></div><p class="muted">账号：'+esc(u.username)+'</p>'+(u.reviewNote?'<p class="details">审核说明：'+esc(u.reviewNote)+'</p>':'')+(u.status==='active'?'<div class="actions"><a id="enterDashboard" class="btn primary" href="/t/'+u.slug+'/admin">进入排单后台</a><a data-booking-link="/t/'+u.slug+'/" class="btn" href="/t/'+u.slug+'/">查看客人预约页</a><button class="btn" id="copyBookingLink">复制预约链接</button></div>':'<div class="notice">账号正在等待运营者批准和分配额度，当前无法创建场次或开放预约。</div>')+'</section><section class="card"><h2>已获批的使用额度</h2><div class="rows">'+cells+'</div><p class="quota-hint">场次和预约包含归档、取消记录；通知按每次发送尝试计数，失败重试也计入。存储以记录、图片和通知队列占用计；每日请求以 UTC 日界线计数。</p></section><section class="card yellow"><h2>申请增加额度</h2>'+(u.request?.status==='pending'?'<p class="notice">已有待审核额度申请，请等待处理。</p><p class="details">'+esc(quotaText(u.request.quota))+'\n'+esc(u.request.reason)+'</p>':'<p class="muted">填写你希望调整后的总额度。提交申请不会立即增加额度。</p><form id="quotaRequest">'+quotaForm(q)+'<label for="quotaReason">为什么需要增加？</label><textarea id="quotaReason" name="reason" maxlength="500" required></textarea><div class="actions"><button type="submit" class="btn primary">预览并申请</button></div></form>')+'</section>';
 if($('copyBookingLink'))$('copyBookingLink').onclick=()=>navigator.clipboard.writeText(location.origin+'/t/'+u.slug+'/').then(()=>{$('copyBookingLink').textContent='已复制'}).catch(()=>{error(Error('请从浏览器地址栏复制预约链接'))});
 if($('quotaRequest'))$('quotaRequest').onsubmit=e=>{e.preventDefault();const quota=getQuota(e.target),reason=e.target.elements.reason.value;confirmAction('向运营者申请新的总额度：\n'+quotaText(quota)+'\n原因：'+reason,()=>api('quota-request',{quota,reason}))};
}
async function renderOwner(){
 const d=await api('owner/list'),p=d.policy;$('heading').textContent='申请审核与配额分发';$('subtitle').textContent='只有你的确认才能批准注册、分配额度或调整公共服务上限。';$('logout').classList.remove('hidden');
 $('view').innerHTML='<section class="card"><h2>公共服务上限</h2><form id="policyForm"><label class="check"><input name="registrationOpen" type="checkbox" '+(p.registrationOpen?'checked':'')+'>允许提交注册申请</label><div class="form-grid">'+[['maxActiveAccounts','最多获批账号数'],['maxAccounts','最多保存的账号申请数'],['maxPending','最多待审核申请数'],['globalRequestsPerDay','服务每天接口请求保护上限']].map(([k,l])=>'<div><label>'+l+'</label><input name="'+k+'" type="number" min="0" required value="'+(p[k]||0)+'"></div>').join('')+'</div><h3 style="margin-top:20px">所有获批账号可分配的总额度</h3>'+quotaForm(p.quotaBudget,'budget')+'<p class="quota-hint">已分配总额度不能超过这里的上限；修改服务上限不会自动给任何账号增加额度。</p><div class="actions"><button type="submit" class="btn primary">预览并保存上限</button></div></form><p class="muted">今日已接收接口请求：'+d.globalUsage.count+'</p><p class="muted">公共服务实际 SQLite 存储：'+(d.storage?.registryBytes==null?'本地模拟不统计':((d.storage.registryBytes+d.storage.tenantsBytes)/1048576).toFixed(2)+' MB')+'（账号及排单对象，不含原站点）</p></section><section class="card"><h2>账号与额度申请（'+d.users.length+'）</h2><div id="users">'+d.users.map(u=>'<article class="review"><h3>'+esc(u.name)+' · '+esc(u.username)+' <span class="pill '+u.status+'">'+labels[u.status]+'</span></h3><p class="details">联系方式：'+esc(u.contact)+'\n注册原因：'+esc(u.reason)+'</p>'+(u.request?'<p class="details">额度申请：'+esc(u.request.status)+'\n'+esc(quotaText(u.request.quota))+'\n原因：'+esc(u.request.reason)+'</p>':'')+'<button class="btn" data-review="'+u.id+'">审核并设置额度</button>'+(['pending','rejected'].includes(u.status)&&Object.values(u.quota).every(n=>n===0)?'<button class="btn" data-remove="'+u.id+'">移除空申请</button>':'')+'</article>').join('')+(d.users.length?'':'<p class="muted">尚无申请。不会预置或自动批准账号。</p>')+'</div></section>';
 $('policyForm').onsubmit=e=>{e.preventDefault();const f=e.target,next={expectedRevision:p.revision,registrationOpen:f.elements.registrationOpen.checked,quotaBudget:getQuota(f)};for(const k of ['maxActiveAccounts','maxAccounts','maxPending','globalRequestsPerDay'])next[k]=Number(f.elements[k].value);confirmAction('注册申请：'+(next.registrationOpen?'开放':'关闭')+'\n最多获批账号：'+next.maxActiveAccounts+'\n服务总额度：\n'+quotaText(next.quotaBudget)+'\n此操作不会自动批准账号。',()=>api('owner/policy',next))};
 document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(d.users.find(u=>u.id===b.dataset.review)));
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const u=d.users.find(u=>u.id===b.dataset.remove);confirmAction('移除未分配额度的空申请：'+u.username+'\n该账号的登录会话将失效。',()=>api('owner/remove-application',{id:u.id,expectedRevision:u.revision}))});
}
function review(u){
 const wrapper=document.createElement('section');wrapper.className='card';wrapper.id='reviewEditor';$('reviewEditor')?.remove();wrapper.innerHTML='<h2>审核 '+esc(u.username)+'</h2><form id="reviewForm"><label>审核结果</label><select name="status"><option value="active">批准使用并分配额度</option><option value="rejected">拒绝申请</option><option value="suspended">暂停账号</option></select>'+quotaForm(u.quota,'review')+'<div class="actions"><button class="btn" type="button" id="starterQuota">填入首批建议额度</button>'+(u.request?.status==='pending'?'<button class="btn" type="button" id="requestedQuota">采用申请数值</button>':'')+'</div><label>给申请者的审核说明</label><textarea name="note" maxlength="500">'+esc(u.reviewNote)+'</textarea><div class="actions"><button type="button" class="btn" id="cancelReview">返回列表</button><button class="btn primary" type="submit">预览审核结果</button></div></form>'; $('view').prepend(wrapper);wrapper.scrollIntoView({behavior:'smooth'});
 const f=$('reviewForm'),fill=q=>Object.keys(quotaNames).forEach(k=>f.elements[k].value=k==='bytes'?q[k]/1048576:q[k]);$('starterQuota').onclick=()=>fill({events:20,orders:200,bytes:100*1048576,notifications:600,requestsPerDay:1000});if($('requestedQuota'))$('requestedQuota').onclick=()=>fill(u.request.quota);$('cancelReview').onclick=()=>wrapper.remove();f.onsubmit=e=>{e.preventDefault();const next={id:u.id,expectedRevision:u.revision,status:f.elements.status.value,quota:getQuota(f),note:f.elements.note.value};confirmAction('账号：'+u.username+'\n审核结果：'+labels[next.status]+'\n分配额度：\n'+quotaText(next.quota)+'\n说明：'+next.note,()=>api('owner/review',next))};
}
async function load(){try{const j=await api('me');$('error').textContent='';if(j.owner){await renderOwner()}else renderAccount(j)}catch(e){if(e.message==='请先登录'){renderAuth()}else error(e)}}
$('logout').onclick=async()=>{try{await api('logout',{});location.href='/app'}catch(e){error(e)}};load();
</script></body></html>
